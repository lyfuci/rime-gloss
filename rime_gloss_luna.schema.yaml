# encoding: utf-8
# 不改你现有方案，多一个可切换的「明月拼音·释义」。
# 小狼毫 / 鼠须管 / fcitx 自带 luna_pinyin，因此默认可部署。

__include: luna_pinyin.schema:/

__patch:
  schema/schema_id: rime_gloss_luna
  schema/name: 明月拼音·释义
  schema/version: "0.1.0"
  schema/description: "luna_pinyin + rime-gloss 英/日简释。学习向，不改变上屏文本。"
  engine/filters/@next: lua_filter@rime_gloss_filter
  switches/@next:
    options: [gloss_off, gloss_en, gloss_ja, gloss_both]
    states: [释义关, 英, 日, 双语]
    reset: 1
  rime_gloss/default: en
