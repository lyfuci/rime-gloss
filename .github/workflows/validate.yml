name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate gloss data
        run: python3 tools/validate_tsv.py
      - name: Install Lua 5.4 (the version librime-lua uses)
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: Filter tests
        run: |
          lua5.4 tests/filter_test.lua
          lua5.4 tests/dict_lookup_test.lua
      - name: Enable-script tests
        run: python3 tests/enable_schema_test.py
      - name: Dictionary build tests
        run: |
          python3 tests/build_dicts_test.py
          python3 tests/cognates_test.py

  e2e:
    # The real librime 1.10 + librime-lua from Ubuntu: deploy, type, read comments.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install librime, librime-lua and Rime data
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librime-dev librime-plugin-lua rime-prelude rime-data-luna-pinyin rime-essay libopencc-data
      - name: Real-Rime end-to-end test
        run: |
          shared="$RUNNER_TEMP/rime-shared"
          mkdir -p "$shared/opencc"
          cp -rL /usr/share/rime-data/. "$shared/"
          cp /usr/share/opencc/* "$shared/opencc/"
          cc -o "$RUNNER_TEMP/rime_probe" tests/e2e/rime_probe.c -lrime -ldl
          git clone -q --depth 1 https://github.com/lazyfoxchan/rime-jaroomaji.git "$RUNNER_TEMP/jaroomaji"
          python3 tests/e2e/run_e2e.py --probe "$RUNNER_TEMP/rime_probe" --shared "$shared" \
            --plugin /usr/lib/x86_64-linux-gnu/rime-plugins/librime-lua.so --jaroomaji "$RUNNER_TEMP/jaroomaji"
      - name: Install with the real plum from this branch, then test that
        env:
          REF: ${{ github.repository }}@${{ github.head_ref || github.ref_name }}
        run: |
          git clone -q --depth 1 https://github.com/rime/plum.git "$RUNNER_TEMP/plum"
          dir="$RUNNER_TEMP/plum-rime"
          mkdir -p "$dir"
          (cd "$RUNNER_TEMP/plum" && rime_dir="$dir" bash rime-install "$REF" "$REF:dict-zh-en" "$REF:dict-zh-ja") 2>&1 | tee "$RUNNER_TEMP/plum.log"
          if grep -qE "No files updated|Invalid recipe|Error" "$RUNNER_TEMP/plum.log"; then
            echo "::error::plum did not install the package cleanly"; exit 1
          fi
          python3 tests/e2e/run_e2e.py --probe "$RUNNER_TEMP/rime_probe" --shared "$RUNNER_TEMP/rime-shared" \
            --plugin /usr/lib/x86_64-linux-gnu/rime-plugins/librime-lua.so --installed "$dir"
